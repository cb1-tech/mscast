[project]
name = "mscast_erp"
authors = [{ name = "MSCAST Engineering Pvt Ltd" }]
description = "MSCAST ERP - configuration, custom documents, reports and controls for an engineer-to-order casting machine builder"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
